# KeyMatch — nginx site (API + WebSocket + built web app on one origin).
#
#   sudo cp infra/nginx/keymatch.conf /etc/nginx/sites-available/keymatch
#   sudo sed -i 's/keymatch.example.com/YOUR.DOMAIN/' /etc/nginx/sites-available/keymatch
#   sudo ln -s /etc/nginx/sites-available/keymatch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN          # adds the 443 block + redirect
#
# The API listens on 127.0.0.1:3400 (PORT in server/.env) so it can sit next
# to RevMatch (3200) on the same VPS.

# Variable name is KeyMatch-specific so it never collides with another site's
# `map $http_upgrade $connection_upgrade` in the same http{} context.
map $http_upgrade $km_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name keymatch.example.com;

  # Photo / document uploads and CSV imports.
  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:3400;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime socket at /ws (inbox, badges, live AI) — keep it open.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $km_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Streamed AI responses must not be buffered.
    proxy_buffering off;
  }
}
