services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estate_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3200:3200"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/estate_crm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      REFRESH_SECRET: ${REFRESH_SECRET:?set REFRESH_SECRET in .env (openssl rand -hex 32)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-demo}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-1}
      APP_URL: ${APP_URL:-http://localhost:3200}
    volumes:
      - appdata:/data
volumes:
  pgdata:
  appdata:
